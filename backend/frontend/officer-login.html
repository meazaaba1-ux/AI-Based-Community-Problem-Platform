
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Officer Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e40af;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Officer Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Officer Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            try {

                const response = await fetch("http://127.0.0.1:8000/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    message.style.color = "red";
                    message.textContent = data.detail || "Login failed";
                    return;
                }

                if (data.role !== "officer") {
                    message.style.color = "red";
                    message.textContent = "This account is not an officer account.";
                    return;
                }

                // Save officer information
                sessionStorage.setItem("officer_id", data.id);
                sessionStorage.setItem("officer_name", data.name);
                sessionStorage.setItem("officer_category", data.category);

                // Open officer dashboard
                window.location.href = "officer.html";

            } catch (error) {

                message.style.color = "red";
                message.textContent = "Cannot connect to server.";

            }

        });
    </script>

</body>
</html>
